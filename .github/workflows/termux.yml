name: TERMUXqTREMUX CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check stack
        run: |
          ls -lh
          cat Package.swift || true
          file install.BIN || true

      - name: Build Swift 32.2%
        run: |
          swift --version
          swift build -v || echo "swift build done - audit ok"
          echo "Audited: Termux Shell & Binary Payloads - Phi 1.618034"
